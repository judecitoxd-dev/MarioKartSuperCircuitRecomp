name: Android CI

on:
  push:
    branches: [android-port-v1]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'gbarecomp'
      - 'recomp-ui'
      - 'mods/**'
      - 'game.toml'
  pull_request:
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'gbarecomp'
      - 'recomp-ui'
      - 'mods/**'
      - 'game.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'cmake;3.22.1' \
            'ndk;26.3.11579264'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x android/gradlew android/SDL/android-project/gradlew
          ./android/gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarioKartSuperCircuitRecomp-Android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Verify APK does not contain ROM or BIOS
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          if unzip -l "$APK" | grep -Eiq '(\.gba$|gba_bios\.bin$|mario_kart_super_circuit_usa\.gba$)'; then
            echo 'Refusing artifact: copyrighted ROM/BIOS input was packaged.' >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MarioKartSuperCircuitRecomp-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
