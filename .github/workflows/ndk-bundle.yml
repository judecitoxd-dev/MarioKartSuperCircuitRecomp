name: NDK Bundle

on:
  push:
    branches:
      - android-port-v1
    paths:
      - '.github/workflows/ndk-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Install exact NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.3.11579264'

      - name: Pack NDK r26d
        run: |
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          du -sh "$NDK"
          tar -C "$ANDROID_HOME/ndk" -czf "$RUNNER_TEMP/android-ndk-r26d.tar.gz" 26.3.11579264
          ls -lh "$RUNNER_TEMP/android-ndk-r26d.tar.gz"

      - name: Upload NDK
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-r26d-linux
          path: ${{ runner.temp }}/android-ndk-r26d.tar.gz
          compression-level: 0
          retention-days: 1
