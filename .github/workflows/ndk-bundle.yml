name: NDK Bundle

on:
  push:
    branches:
      - android-port-v1
    paths:
      - '.github/workflows/ndk-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Install exact NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.3.11579264'

      - name: Pack and split NDK r26d
        run: |
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          tar -C "$ANDROID_HOME/ndk" -czf "$RUNNER_TEMP/android-ndk-r26d.tar.gz" 26.3.11579264
          split -b 350M "$RUNNER_TEMP/android-ndk-r26d.tar.gz" "$RUNNER_TEMP/ndk-part-"
          ls -lh "$RUNNER_TEMP"/ndk-part-*
          test -f "$RUNNER_TEMP/ndk-part-aa"
          test -f "$RUNNER_TEMP/ndk-part-ab"

      - name: Upload NDK part A
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-r26d-part-a
          path: ${{ runner.temp }}/ndk-part-aa
          compression-level: 0
          retention-days: 1

      - name: Upload NDK part B
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-r26d-part-b
          path: ${{ runner.temp }}/ndk-part-ab
          compression-level: 0
          retention-days: 1
