name: Source Bundle

on:
  push:
    branches:
      - android-port-v1
    paths:
      - '.github/workflows/source-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Vendor pinned toml++ single header
        run: |
          mkdir -p gbarecomp/third_party/tomlpp
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/marzer/tomlplusplus/30172438cee64926dc41fdd9c11fb3ba5b2ba9de/single_include/toml++/toml.hpp' \
            -o gbarecomp/third_party/tomlpp/toml.hpp

      - name: Create source bundle
        run: |
          tar --exclude-vcs --exclude='./build' --exclude='./android/app/build' -czf "$RUNNER_TEMP/mksc-source-with-submodules.tar.gz" .

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: mksc-source-with-submodules
          path: ${{ runner.temp }}/mksc-source-with-submodules.tar.gz
          retention-days: 1
